<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FieldGuard HVAC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #111; color: #f5f5f5; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .meta { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .cat { font-size: 0.8rem; color: #58a6ff; font-weight: bold; }
    .name { font-size: 1.05rem; font-weight: bold; margin: 4px 0; }
    .action { font-size: 0.92rem; color: #ddd; margin-top: 6px; }
    .sponsor-card { background: #16221c; border: 1px solid #2e7d5b; border-radius: 8px; padding: 14px; margin-top: 20px; }
    .sponsor-cat { font-size: 0.78rem; color: #4ade80; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .sponsor-btn { display: inline-block; margin-top: 10px; padding: 10px 14px; background: #25D366; color: #0b1911; font-weight: bold; font-size: 0.9rem; text-decoration: none; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>FieldGuard HVAC</h1>
  <div class="meta" id="meta">Loading compliance rules...</div>
  <div id="checks"></div>

  <div class="sponsor-card">
    <div class="sponsor-cat">Featured Supplier Partner &bull; Spot Available</div>
    <div class="name">Reach HVAC &amp; Refrigeration Technicians Daily</div>
    <div class="action">Feature your spare parts shop, refrigerants, or service tools directly inside FieldGuard HVAC.</div>
    <a class="sponsor-btn" href="https://wa.me/254720353326?text=Hi%2C%20I%27m%20interested%20in%20sponsoring%20the%20Featured%20Supplier%20spot%20on%20FieldGuard%20HVAC." target="_blank" rel="noopener">Book This Spot on WhatsApp</a>
  </div>

  <script>
    fetch("rules.json")
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("meta").textContent =
          `${data.industry} • v${data.version}`;
        const container = document.getElementById("checks");
        data.compliance_checks.forEach((item) => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <div class="cat">${item.category}</div>
            <div class="name">${item.name}</div>
            <div class="action">${item.required_action}</div>
          `;
          container.appendChild(div);
        });
      })
      .catch(() => {
        document.getElementById("meta").textContent = "Could not load rules.json";
      });
  </script>
</body>
</html>
